<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Certification Study</title>
  <meta name="description" content="Local, offline study app for Claude certification exams." />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="#141414"><rect x="10.7" y="2.4" width="2.6" height="19.2" rx="1.3"></rect><rect x="10.7" y="2.4" width="2.6" height="19.2" rx="1.3" transform="rotate(60 12 12)"></rect><rect x="10.7" y="2.4" width="2.6" height="19.2" rx="1.3" transform="rotate(120 12 12)"></rect></g></svg></span>
        <div class="brand__text"><strong>Claude Certification Study</strong></div>
      </div>
      <nav class="exam-switch" id="exam-switch" aria-label="Exam"></nav>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light/dark theme">
        <span class="icon-btn__glyph" aria-hidden="true">◐</span>
      </button>
    </div>
    <div class="subnav">
      <div class="subnav__inner">
        <span class="subnav__exam" id="exam-name">Loading…</span>
        <nav class="tabs" aria-label="Sections">
          <a class="tab" href="#/concepts" data-view="concepts">Concepts</a>
          <a class="tab" href="#/flashcards" data-view="flashcards">Flashcards</a>
          <a class="tab" href="#/labs" data-view="labs">Labs</a>
          <a class="tab" href="#/quiz" data-view="quiz">Quiz</a>
          <a class="tab" href="#/readiness" data-view="readiness">Readiness</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div class="loading">Loading study content…</div>
  </main>

  <footer class="app-footer">
    <span>Local &amp; Offline · Progress Stays in This Browser</span>
    <span class="app-footer__sep">·</span>
    <a href="https://docs.claude.com" target="_blank" rel="noopener">Claude Docs</a>
    <span class="app-footer__sep" id="app-version-sep" hidden>·</span>
    <span id="app-version" hidden></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
