[project]
name = "cert-anthropic-study"
version = "2.1.0"
description = "Local, offline, multi-exam study app + content for Claude certification exams (question banks, flashcards, concepts, readiness)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
