[project]
name = "cert-anthropic-labs"
version = "0.1.0"
description = "Hands-on labs for the Claude Certified Architect – Foundations (CCAR-F) exam"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Only needed for the optional live/LLM-graded paths:
    "anthropic>=0.40",
    # Claude Agent SDK (used by the multi-agent labs' live path):
    # "claude-agent-sdk>=0.1",  # uncomment if exercising the live Agent SDK path
]

[tool.pytest.ini_options]
# Default run is deterministic & offline. To include semantic checks:
#   ANTHROPIC_API_KEY=... uv run pytest -m llm
addopts = "-m 'not llm' -q"
markers = [
    "llm: test requires a live Claude call (needs ANTHROPIC_API_KEY)",
]
testpaths = ["."]
python_files = ["test_*.py"]
